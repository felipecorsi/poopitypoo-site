<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in the burrow - Poopitypoo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='38' fill='%23b9c46a'/><circle cx='38' cy='42' r='13' fill='white'/><circle cx='62' cy='42' r='13' fill='white'/><circle cx='40' cy='44' r='6' fill='%23222'/><circle cx='60' cy='44' r='6' fill='%23222'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a120c; color: #f6ead6; font-family: "Nunito", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    background-image: url("assets/scene-rain.jpg"); background-size: cover; background-position: center;
  }
  .veil { position: fixed; inset: 0; background: rgba(26,18,12,0.82); }
  .card { position: relative; padding: 40px 28px; max-width: 480px; }
  h1 { font-family: "Fredoka", sans-serif; font-size: 96px; color: #f0a742; line-height: 1; }
  h2 { font-family: "Fredoka", sans-serif; font-size: 26px; margin: 10px 0 10px; }
  p { color: #c9b494; margin-bottom: 28px; }
  .btn {
    display: inline-block; background: #f0a742; color: #2a1c0d; font-family: "Fredoka", sans-serif;
    font-weight: 600; font-size: 17px; padding: 14px 30px; border-radius: 999px; text-decoration: none;
    box-shadow: 0 6px 26px rgba(240,167,66,0.35);
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="veil"></div>
  <div class="card">
    <h1>404</h1>
    <h2>You wandered off the path.</h2>
    <p>Even the littlest wanderer gets lost sometimes. The lanterns will lead you home.</p>
    <a class="btn" href="/">&#8962;&nbsp; Back to the burrow</a>
  </div>
</body>
</html>
