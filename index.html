<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poopitypoo</title>
<meta name="description" content="A cozy little show about a small wanderer and the friends he finds along the way. Watch the trailer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='38' fill='%23b9c46a'/><circle cx='38' cy='42' r='13' fill='white'/><circle cx='62' cy='42' r='13' fill='white'/><circle cx='40' cy='44' r='6' fill='%23222'/><circle cx='60' cy='44' r='6' fill='%23222'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a120c;
    --bg-2: #241a11;
    --amber: #f0a742;
    --glow: #ffcf87;
    --cream: #f6ead6;
    --muted: #c9b494;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--cream); font-family: "Nunito", sans-serif; line-height: 1.65; }
  h1, h2, h3, .brand { font-family: "Fredoka", sans-serif; }
  img, video { max-width: 100%; display: block; }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

  header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 22px 0; }
  header .container { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 26px; font-weight: 700; color: var(--cream); text-decoration: none; letter-spacing: 0.5px; }
  .brand span { color: var(--amber); }
  nav a { color: var(--cream); text-decoration: none; margin-left: 22px; font-weight: 700; font-size: 15px; opacity: 0.9; }
  nav a:hover { color: var(--glow); }

  .hero { position: relative; min-height: 92vh; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .hero .bg { position: absolute; inset: 0; background: url("assets/hero-market.jpg") center 30%/cover no-repeat; }
  .hero .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,18,12,0.35) 0%, rgba(26,18,12,0.0) 45%, rgba(26,18,12,0.85) 97%); }
  .hero-inner { position: relative; padding: 0 0 52px; text-align: center; }
  .btn {
    display: inline-block; background: var(--amber); color: #2a1c0d; font-family: "Fredoka", sans-serif;
    font-weight: 600; font-size: 17px; padding: 14px 30px; border-radius: 999px; text-decoration: none;
    box-shadow: 0 6px 26px rgba(240,167,66,0.35); transition: transform .15s ease, box-shadow .15s ease;
    border: none; cursor: pointer;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(240,167,66,0.45); }

  section { padding: 90px 0; }
  .kicker { color: var(--amber); font-family: "Fredoka", sans-serif; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; margin-bottom: 8px; }
  h2 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 8px; }
  .intro { color: var(--muted); max-width: 520px; margin-bottom: 36px; font-size: 16.5px; }

  .trailer { background: var(--bg-2); }
  .trailer .container { text-align: center; }
  .trailer .intro { margin-left: auto; margin-right: auto; }
  .player-wrap { width: min(1480px, calc(100vw - 28px)); margin: 0 auto; }
  .player { border-radius: 18px; overflow: hidden; box-shadow: 0 20px 70px rgba(0,0,0,0.55); border: 1px solid rgba(240,167,66,0.18); }
  .player video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }

  .scenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
  .scene { border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 10px 34px rgba(0,0,0,0.45); }
  .scene img { transition: transform .35s ease; height: 100%; object-fit: cover; }
  .scene:hover img { transform: scale(1.045); }

  .soon { background: var(--bg-2); text-align: center; }
  .soon p { color: var(--muted); max-width: 440px; margin: 0 auto 26px; }

  footer { padding: 36px 0 44px; text-align: center; color: var(--muted); font-size: 13.5px; }
  footer .dot { color: var(--amber); }

  /* Gentle scroll reveal */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
</style>
</head>
<body>

<header>
  <div class="container">
    <a class="brand" href="#">poopity<span>poo</span></a>
    <nav>
      <a href="#trailer" data-play-trailer>Trailer</a>
      <a href="#world">The World</a>
      <a href="#soon">Coming Soon</a>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="hero-inner">
    <button class="btn" data-play-trailer>&#9654;&nbsp; Watch the Trailer</button>
  </div>
</div>

<section class="trailer" id="trailer">
  <div class="container reveal">
    <p class="kicker">Trailer</p>
    <h2>The first peek</h2>
  </div>
  <div class="player-wrap reveal">
    <div class="player">
      <video id="trailer-video" controls playsinline preload="metadata" poster="assets/trailer-poster.jpg">
        <source src="assets/trailer-web.mp4" type="video/mp4">
      </video>
    </div>
  </div>
</section>

<section id="world">
  <div class="container">
    <div class="reveal">
      <p class="kicker">The World</p>
      <h2>The world of Poopitypoo</h2>
      <p class="intro">Lantern light, mushroom markets, and friends not met yet.</p>
    </div>
    <div class="scenes reveal">
      <div class="scene"><img src="assets/scene-rain.jpg" alt="Sheltering from the rain under a leaf"></div>
      <div class="scene"><img src="assets/scene-campfire.jpg" alt="Stories by the campfire"></div>
      <div class="scene"><img src="assets/scene-branch.jpg" alt="Resting on a mossy branch"></div>
      <div class="scene"><img src="assets/scene-market.jpg" alt="The mushroom market"></div>
    </div>
  </div>
</section>

<section class="soon" id="soon">
  <div class="container reveal">
    <p class="kicker">Coming Soon</p>
    <h2>New episodes are coming</h2>
    <p>The journey begins soon on YouTube.</p>
    <button class="btn" data-play-trailer>&#9654;&nbsp; Watch the Trailer</button>
  </div>
</section>

<footer>
  poopitypoo<span class="dot">.</span>com
</footer>

<script>
  // "Watch the Trailer" centers the video on screen and starts it playing.
  const video = document.getElementById("trailer-video");
  document.querySelectorAll("[data-play-trailer]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      video.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => { video.play().catch(() => {}); }, 650);
    });
  });

  // Gentle reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>

</body>
</html>
